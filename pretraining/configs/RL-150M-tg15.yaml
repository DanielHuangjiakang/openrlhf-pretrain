# 150M pretraining, 15% TinyGSM. One of three compute-matched groups.
#
# The three configs differ ONLY in `run_name` and `data.paths`; everything else
# is identical by construction, so a change to one must be made to all three.
# RL-150M.yaml is the single-source reference they were generated from.
#
# Data comes from build_mixture.py, which gives every group the same 488,192
# blocks (= 1907 steps x 256) and varies only how many of them are TinyGSM.
run_name: OLMo-150M-tg15
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: olmo-debug
  entity: <YOUR WANDB ENTITY>

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 8
  weight_tying: false
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: false
  block_type: sequential
  layer_norm_type: default
  layer_norm_with_affine: false
  bias_for_layer_norm: false
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 32000
  embedding_size: 32000
  eos_token_id: 0
  pad_token_id: 1
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

ddp:
  grad_sync_mode: batch
  find_unused_params: false

compile: null

optimizer:
  name: adamw
  learning_rate: 0.001
  weight_decay: 0.1
  eps: 1e-8
  decay_norm_and_bias: true
  decay_embeddings: true
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  # NOTE: t_warmup is in STEPS (scheduler.units defaults to `steps`), not tokens.
  # The upstream value of 5000 assumed a full-epoch run of tens of thousands of
  # steps. Under a fixed 1B-token budget this run is only 1907 steps, so 5000
  # would mean the LR never finishes warming up. Keep this at ~5% of max_steps.
  t_warmup: 100
  alpha_f: 0.1
  warmup_min_lr: 0

tokenizer:
  identifier: meta-llama/Llama-2-7b-hf
  truncate_direction: right

save_folder: <PATH_TO_CHECKPOINT>/${run_name}
save_overwrite: false

# Unsharded checkpoints (for ddp)
# Both intervals used to be larger than the entire run length below (20000 and
# 2000 vs 1907 total steps), which would mean no checkpoint was ever written
# mid-run. Scaled down so we get one mid-run checkpoint plus the final one.
save_interval_unsharded: 1000
save_num_unsharded_checkpoints_to_keep: 1
save_interval: 500
save_num_checkpoints_to_keep: 1

load_path: null

# --- Compute budget -----------------------------------------------------------
# Was `4ep`. Epoch-based durations make total compute a function of how much data
# happens to be in the mixture, so two mixtures are never compute-matched. A `T`
# suffix means "train on this many tokens" and is handled by Trainer.max_steps
# (OLMo/olmo/train.py:266).
#
#   max_steps = 1e9 / (global_train_batch_size * max_sequence_length)
#             = 1e9 / (256 * 2048) = 1907
#
# stop_at is set explicitly because it otherwise defaults to max_steps + 10
# (OLMo/olmo/train.py:1116), which overshoots the budget under a `T` duration.
max_duration: 1e9T
stop_at: 1907

# Was 512 (1.05M tokens/step), which leaves only 954 steps at a 1B budget. 256
# halves tokens/step and doubles the number of optimizer steps for the same
# token count, which is the better trade for a 150M model at this scale.
global_train_batch_size: 256

# Was 16. At seq_len 2048 that is 32k tokens per microbatch; combined with the
# 32k-vocab logits tensor it peaks around 19GB, too close to a 24GB card. 8 puts
# the peak near 11GB with no measurable throughput cost (we are already
# gradient-accumulating).
device_train_microbatch_size: 8

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

# Held-out evaluation. This matters more than usual here: the three groups train
# on different data, so their train losses are NOT comparable -- TinyGSM is
# templated and scores far lower than web text regardless of model quality. The
# evaluators below read the same held-out blocks in every group, so their curves
# are the only cross-group signal during training.
#
# Produced by `build_mixture.py --holdout-blocks N`, which reserves them from the
# tail of every source file; groups only take prefixes, so there is no leakage.
#
# Optional extra: `- {label: basic_arithmetic, type: downstream}` gives an
# in-loop accuracy curve, but it downloads task data on first use and a failure
# there aborts the run, so it is left out of the default.
eval_interval: 200
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}

data:
  pad_direction: right
  num_workers: 32
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  paths: ${path.glob:<PATH_TO_MIXTURES>/tg15/*/*.ds}
evaluators:
  - label: heldout-tinygsm
    type: lm
    data:
      paths: ${path.glob:<PATH_TO_MIXTURES>/holdout/tinygsm/*.ds}
    subset_num_batches: 20
  - label: heldout-finemath3
    type: lm
    data:
      paths: ${path.glob:<PATH_TO_MIXTURES>/holdout/finemath3/*.ds}
    subset_num_batches: 20
  - label: heldout-algebraic-stack
    type: lm
    data:
      paths: ${path.glob:<PATH_TO_MIXTURES>/holdout/algebraic-stack/*.ds}
    subset_num_batches: 20
